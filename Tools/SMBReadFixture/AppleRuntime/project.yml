name: SMBRuntimeProof
options:
  bundleIdPrefix: com.samuelvoltolini.gumbo.fixture
  deploymentTarget:
    iOS: "26.1"
    tvOS: "26.0"
    macOS: "26.0"
packages:
  GumboCore:
    path: ../../../Packages/GumboCore
settings:
  base:
    SWIFT_VERSION: "6.2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Tests generated files on an isolated loopback server."
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    PRODUCT_NAME: "$(TARGET_NAME)"
targets:
  SMBProbePhone:
    type: application
    platform: iOS
    sources: [RuntimeProbe.swift]
    dependencies:
      - package: GumboCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.fixture.smb.phone
        TARGETED_DEVICE_FAMILY: "1,2"
  SMBProbeTV:
    type: application
    platform: tvOS
    sources: [RuntimeProbe.swift]
    dependencies:
      - package: GumboCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.fixture.smb.tv
        TARGETED_DEVICE_FAMILY: "3"
  SMBProbeMac:
    type: application
    platform: macOS
    sources: [RuntimeProbe.swift]
    dependencies:
      - package: GumboCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.fixture.smb.mac
