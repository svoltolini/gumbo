<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Gumbo Film — Films and series.</title>
<desc>The Gumbo Film mark with the product name and in-development status on a dark background.</desc>
<rect width="1200" height="630" fill="#101011"/>
<rect x="32" y="32" width="1136" height="566" rx="36" fill="#19191b" stroke="#303033"/>
<g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <text x="80" y="109" font-size="23" fill="#b1b1b5">From the Gumbo family.</text>
  <text x="76" y="233" font-size="96" font-weight="600" letter-spacing="-4" fill="#f4f4f2">Gumbo Film</text>
  <text x="80" y="308" font-size="41" letter-spacing="-1.2" fill="#d4d5d6">Films and series.</text>
  <text x="80" y="460" font-size="25" font-weight="500" fill="#f4f4f2">In development</text>
  <text x="80" y="555" font-size="22" font-weight="500" fill="#f4f4f2">gumbo.one</text>
</g>
