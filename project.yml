name: Gumbo
options:
  bundleIdPrefix: com.samuelvoltolini
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GumboCore:
    path: Packages/GumboCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic
targets:
  GumboUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: GumboUITests
    dependencies:
      - target: Gumbo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.uitests
        DEVELOPMENT_TEAM: C6GW4A76XK
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Gumbo
        TARGETED_DEVICE_FAMILY: "1,2"
  Gumbo:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Gumbo
    dependencies:
      - target: GumboWidgets
      - target: GumboWatch
      - package: GumboCore
        product: GumboCore
      - package: GumboCore
        product: GumboShared
    entitlements:
      path: Gumbo/Gumbo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samuelvoltolini.gumbo
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.gumbo
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Requires Apple's approval for this new App ID and a matching signing profile.
        com.apple.developer.carplay-audio: true
    info:
      path: Gumbo/Info.plist
      properties:
        CFBundleDisplayName: Gumbo Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.samuelvoltolini.gumbo
            CFBundleURLSchemes:
              - gumbo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          # The car's screen is a second scene beside the phone's.
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Without this the system never hands a family invitation link to the app: Safari opens it and calls it invalid.
        CKSharingSupported: true
        NSLocalNetworkUsageDescription: Gumbo looks for music servers on your local network.
        NSFaceIDUsageDescription: Face ID opens your profile without typing its PIN.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - remote-notification
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.samuelvoltolini.gumbo.index
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Gumbo
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac has its own native app (GumboMac); the iPhone/iPad build must not be offered on Macs.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609202055"
  GumboWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: GumboWidgets
      - path: Gumbo/Shared
    dependencies:
      - package: GumboCore
        product: GumboShared
    entitlements:
      path: GumboWidgets/GumboWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samuelvoltolini.gumbo
    info:
      path: GumboWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gumbo Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.widgets
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: GumboWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609202055"
  GumboWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: GumboWatch
      - path: Gumbo/Assets.xcassets
    dependencies:
      - package: GumboCore
        product: GumboCore
    info:
      path: GumboWatch/Info.plist
      properties:
        CFBundleDisplayName: Gumbo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.samuelvoltolini.gumbo
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: Gumbo downloads music from your music server on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo.watchkitapp
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Gumbo
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609202055"
  GumboMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GumboMac
      - path: Gumbo/Views
        excludes:
          - "Main/**"
      - path: Gumbo/Theme
      - path: Gumbo/Assets.xcassets
    dependencies:
      - package: GumboCore
        product: GumboCore
    entitlements:
      path: GumboMac/GumboMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.gumbo
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: GumboMac/Info.plist
      properties:
        CFBundleDisplayName: Gumbo Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © Samuel Voltolini
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: com.samuelvoltolini.gumbo
            CFBundleURLSchemes:
              - gumbo
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Gumbo looks for music servers on your local network.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Gumbo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: macosx
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609202055"
  GumboTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: GumboTV
      - path: Gumbo/Views
        excludes:
          - "Main/**"
      - path: Gumbo/Theme
      - path: Gumbo/Assets.xcassets
    dependencies:
      - package: GumboCore
        product: GumboCore
    entitlements:
      path: GumboTV/GumboTV.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.gumbo
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: GumboTV/Info.plist
      properties:
        CFBundleDisplayName: Gumbo Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Gumbo looks for music servers on your local network.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.gumbo
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Gumbo
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: TVIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609202055"
schemes:
  Gumbo:
    build:
      targets:
        Gumbo: all
  GumboUITests:
    build:
      targets:
        Gumbo: all
        GumboUITests: [test]
    test:
      config: Debug
      targets:
        - name: GumboUITests
          parallelizable: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
